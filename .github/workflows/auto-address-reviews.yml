name: Auto-address PR reviews

# Triggers whenever a review is submitted on a pull request. When the review
# requests changes or leaves comments, we hand the PR off to the GitHub Copilot
# coding agent by assigning @copilot — it will read the review, push a new
# commit on the same branch, and the cycle continues on the next review.
#
# Requirements:
#   - Repo must have "GitHub Copilot coding agent" enabled
#     (Settings → Copilot → Coding agent).
#   - Plan must support the coding agent (Copilot Pro+, Business, Enterprise).
#
# Safety rails:
#   - Only runs on reviews that request changes or leave comments (not plain
#     "approved" reviews).
#   - Only runs while the PR is open.
#   - Has a per-PR attempt cap to prevent runaway loops if the agent can't
#     converge on something the reviewer is happy with.

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  hand-off-to-copilot:
    # Skip approvals and closed PRs
    if: >-
      github.event.pull_request.state == 'open' &&
      (github.event.review.state == 'changes_requested' ||
       github.event.review.state == 'commented') &&
      github.event.review.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Count previous auto-attempts on this PR
        id: attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- auto-address-reviews -->"))] | length')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Previous auto-attempts: ${count}"

      - name: Bail out if attempt cap reached
        if: steps.attempts.outputs.count >= '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="<!-- auto-address-reviews --> ⏸ **Auto-review-loop paused**: reached 5 automated attempts on this PR. A human should take a look before continuing." \
            --method POST
          echo "Attempt cap reached; skipping hand-off."
          exit 0

      - name: Ask @copilot to address the new review
        if: steps.attempts.outputs.count < '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          body=$(cat <<EOF
          <!-- auto-address-reviews -->
          @copilot a new review was submitted by @${REVIEWER} (state: \`${REVIEW_STATE}\`).

          Please:
          1. Read **all** open review comments and inline comments on this PR (including ${REVIEW_URL}).
          2. Address each actionable point with a focused commit on this branch.
          3. Run the project's tests and build locally before pushing.
          4. Reply on each resolved comment thread briefly explaining the fix.
          5. Do **not** force-push; append commits so history is reviewable.

          This is automated attempt #$(( ${{ steps.attempts.outputs.count }} + 1 )) of 5.
          EOF
          )
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="${body}" \
            --method POST
